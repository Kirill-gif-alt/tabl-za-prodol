<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Самолёт">
  <defs>
    <linearGradient id="sky" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="wing" x1="12" y1="20" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- soft highlight -->
  <ellipse cx="22" cy="16" rx="18" ry="10" fill="#ffffff" opacity="0.14"/>
  <!-- plane (top-down, nose to the right) -->
  <g filter="url(#soft)" transform="translate(32 33) rotate(-18) translate(-32 -33)">
    <!-- fuselage -->
    <path fill="url(#wing)" d="
      M 10 32
      C 14 30.2 22 28.6 30 28.4
      L 42 28.2
      C 48 28.1 52.5 29.2 55.2 31
      C 56.4 31.8 56.4 33.2 55.2 34
      C 52.5 35.8 48 36.9 42 36.8
      L 30 36.6
      C 22 36.4 14 34.8 10 33
      C 8.8 32.5 8.8 32.5 10 32 Z"/>
    <!-- main wing -->
    <path fill="#ffffff" d="
      M 28 31.2
      L 18 18.5
      C 17.2 17.4 17.8 16.2 19.2 16.5
      L 36.5 22.2
      C 39.2 23.1 40.5 24.8 40.2 27.2
      L 39.2 31.5
      Z"/>
    <path fill="#ffffff" d="
      M 28 33.8
      L 18 46.5
      C 17.2 47.6 17.8 48.8 19.2 48.5
      L 36.5 42.8
      C 39.2 41.9 40.5 40.2 40.2 37.8
      L 39.2 33.5
      Z"/>
    <!-- tail fin -->
    <path fill="#e0f2fe" d="
      M 14.5 31.5
      L 8.5 24.5
      C 7.8 23.6 8.4 22.6 9.6 22.9
      L 17.5 26.2
      C 18.6 26.7 19 27.6 18.8 28.6
      L 17.8 32.2
      Z"/>
    <path fill="#e0f2fe" d="
      M 14.5 33.5
      L 8.5 40.5
      C 7.8 41.4 8.4 42.4 9.6 42.1
      L 17.5 38.8
      C 18.6 38.3 19 37.4 18.8 36.4
      L 17.8 32.8
      Z"/>
    <!-- cockpit -->
    <ellipse cx="50.5" cy="32" rx="3.2" ry="2.1" fill="#7dd3fc" opacity="0.95"/>
    <!-- window stripe -->
    <path fill="#38bdf8" opacity="0.55" d="
      M 34 30.6
      L 46 30.5
      C 47.2 30.5 47.6 31.2 47.6 32
      C 47.6 32.8 47.2 33.5 46 33.5
      L 34 33.4
      C 33.2 33.4 32.8 32.8 32.8 32
      C 32.8 31.2 33.2 30.6 34 30.6 Z"/>
  </g>
</svg>
